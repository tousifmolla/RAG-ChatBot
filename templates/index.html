<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local PDF AI Chatbot</title><link rel="stylesheet" href="/static/style.css"></head>
<body><div class="app"><aside><h2>📚 Your Documents</h2><label class="upload">+ Upload PDF<input type="file" id="file" accept=".pdf,application/pdf" hidden></label><p id="uploadStatus" aria-live="polite"></p><div id="documents"></div><button id="newChat" class="secondary">New conversation</button><button id="theme" class="secondary">Toggle theme</button></aside><main><header><h1>AI PDF Assistant</h1><span>Local Ollama + RAG</span></header><div id="messages" role="log" aria-live="polite"><div class="bubble bot">Upload a PDF, then ask a question about it.</div></div><form id="chatForm"><input id="message" maxlength="4000" placeholder="Ask about your PDF..." autocomplete="off" required><button id="send" type="submit">Send</button></form><p class="hint">Answers are AI-generated. Verify important details against source pages.</p></main></div><script src="/static/script.js"></script></body></html>
